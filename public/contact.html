<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Contatti — Bella Italia</title>
<meta name="description" content="Dove siamo, orari e contatti. Richiedi il tuo link d'ordine personale su WhatsApp.">
<meta name="theme-color" content="#f7d3da">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7d3da;
    --paper-deep: #f3c2cc;
    --box-fill: #fdedf0;
    --ink: #4a1d29;
    --ink-soft: rgba(74,29,41,.68);
    --white: #fffaf9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper-deep);
    color: var(--ink);
    font-family: 'Patrick Hand', cursive;
    touch-action: manipulation;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .page {
    position: relative;
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    background: var(--paper);
    padding: max(28px, env(safe-area-inset-top)) 28px max(40px, env(safe-area-inset-bottom));
  }
  @media (min-width: 500px) {
    body { padding: 32px 16px; }
    .page { min-height: auto; box-shadow: 0 20px 60px rgba(74,29,41,0.2); }
  }
  .frame-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .content { position: relative; z-index: 1; }

  .back-link {
    font-size: 15px; font-weight: 500; color: var(--ink-soft);
    text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    margin-bottom: 10px;
  }
  .logo-mini {
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 26px;
    color: var(--ink-soft); text-align: center; margin-bottom: 4px;
  }
  h1 {
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 48px;
    text-align: center; margin: 0 0 26px;
  }

  .info-card {
    position: relative;
    background: var(--box-fill);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .info-card svg.card-frame { position: absolute; inset: 0; width: 100%; height: 100%; }
  .info-icon { font-size: 26px; flex-shrink: 0; position: relative; }
  .info-text { position: relative; font-size: 16px; line-height: 1.45; }
  .info-text a { color: var(--ink); }
  .info-label { font-family: 'Caveat', cursive; font-weight: 700; font-size: 19px; display: block; }

  .cta-wrap { display: flex; flex-direction: column; align-items: center; margin: 26px 0 6px; }
  .cta-btn {
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 24px;
    color: var(--ink); background: var(--white); border: none; text-decoration: none;
    padding: 12px 30px; position: relative; display: inline-block;
    transition: transform 0.15s ease;
  }
  .cta-btn:active { transform: scale(0.96); }
  .cta-btn-frame { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .cta-note { text-align: center; font-size: 13px; color: var(--ink-soft); margin-top: 10px; }

  footer {
    text-align: center; font-size: 13px; color: var(--ink-soft);
    margin-top: 30px;
  }
  footer a { text-decoration: underline; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="wobble" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="11" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="6"/>
  </filter>
  <filter id="wobble-sm" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03 0.08" numOctaves="2" seed="6" result="noise2"/>
    <feDisplacementMap in="SourceGraphic" in2="noise2" scale="3.5"/>
  </filter>
</svg>

<div class="page">
  <svg class="frame-svg" viewBox="0 0 400 600" preserveAspectRatio="none">
    <rect x="10" y="10" width="380" height="580" rx="34" fill="none" stroke="var(--ink,#4a1d29)" stroke-width="3.5" filter="url(#wobble)"/>
  </svg>

  <div class="content">
    <a class="back-link" href="index.html">‹ Torna alla home</a>
    <div class="logo-mini">Bella ♥ Italia</div>
    <h1>Contatti</h1>

    <div class="info-card">

      <span class="info-icon">💬</span>
      <span class="info-text">
        <span class="info-label">WhatsApp</span>
        <a href="https://wa.me/393485180143">+39 348 518 0143</a>
      </span>
    </div>

    <div class="info-card">
      <svg class="card-frame" viewBox="0 0 320 80" preserveAspectRatio="none"><rect x="4" y="4" width="312" height="72" rx="14" fill="none" stroke="var(--ink,#4a1d29)" stroke-width="2.5" filter="url(#wobble-sm)"/></svg>
      <span class="info-icon">📍</span>
      <span class="info-text">
        <span class="info-label">Dove siamo</span>
        <a href="https://maps.app.goo.gl/ZqHhxGBQMCTcr6Uc7?g_st=ic" target="_blank" rel="noopener">Via Galileo Ferraris, 136, 80146 Napoli NA</a>
      </span>
    </div>

    <div class="info-card">
      <svg class="card-frame" viewBox="0 0 320 80" preserveAspectRatio="none"><rect x="4" y="4" width="312" height="72" rx="14" fill="none" stroke="var(--ink,#4a1d29)" stroke-width="2.5" filter="url(#wobble-sm)"/></svg>
      <span class="info-icon">🕒</span>
      <span class="info-text">
        <span class="info-label">Orari</span>
        Lun–Sab 8:00–18:00 · Dom 8:00–15:00
      </span>
    </div>

    <div class="cta-wrap">
      <a class="cta-btn" id="waBtn" href="https://wa.me/393485180143?text=Salve%2C%20vorrei%20richiedere%20il%20link%20per%20ordinare.%20La%20mia%20attivit%C3%A0%20%C3%A8%3A%20" target="_blank" rel="noopener">
        <svg class="cta-btn-frame" viewBox="0 0 260 60" preserveAspectRatio="none"><rect x="4" y="4" width="252" height="52" rx="26" fill="none" stroke="var(--ink,#4a1d29)" stroke-width="3" filter="url(#wobble-sm)"/></svg>
        <span style="position:relative">Scrivici su WhatsApp</span>
      </a>
      <p class="cta-note">Rispondiamo in giornata negli orari di apertura.</p>
    </div>

    <footer>
      © <span id="yr"></span> Bella Italia — P.IVA 00000000000<br>
      <a href="privacy.html">Privacy</a>
    </footer>
  </div>
</div>

<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TRUCCHI — Bella Italia</title>
<meta name="description" content="Trucchi all'ingrosso: fondotinta, palette, rossetti, cipria e altro. Richiedi il listino su WhatsApp.">
<meta name="theme-color" content="#fdeeea">
<script src="/js/i18n.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #fdeeea;
    touch-action: manipulation;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .top-bar {
    width: 100%; max-width: 700px;
    padding: max(14px, env(safe-area-inset-top)) 18px 10px;
  }
  .back-link {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; font-weight: 500;
    color: #4a1d29;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .art-wrap {
    position: relative;
    width: 100%;
    max-width: 700px;
    line-height: 0;
  }
  .art-wrap img { width: 100%; height: auto; display: block; }
  .listino-hit {
    position: absolute;
    left: 2.5%;
    top: 81%;
    width: 20%;
    height: 13%;
  }
  footer {
    padding: 18px 20px max(18px, env(safe-area-inset-bottom));
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 12.5px;
    color: rgba(74,29,41,0.55);
  }
  footer a { color: inherit; }
</style>
</head>
<body>

<div class="top-bar">
  <a class="back-link" href="index.html">‹ Torna alla home</a>
</div>

<div class="art-wrap">
  <img src="/img/trucchi.webp" alt="Trucchi — Bella Italia">
  <a class="listino-hit" id="listinoBtn" href="#" target="_blank" rel="noopener" aria-label="Richiedi il listino su WhatsApp"></a>
</div>

<footer>
  <a href="privacy.html">Privacy</a>
  &nbsp;·&nbsp;
  <a href="contact.html">Contatti</a>
</footer>

<script>
  var WA_MESSAGES = {
    it: "Ciao! Vorrei ricevere il listino trucchi 😊",
    en: "Hi! I'd like to receive the makeup price list 😊",
    fr: "Bonjour ! Je voudrais recevoir la liste des prix maquillage 😊",
    es: "¡Hola! Me gustaría recibir la lista de precios de maquillaje 😊"
  };
  function updateWhatsAppLink() {
    var lang = (window.I18N && I18N.getLang) ? I18N.getLang() : 'it';
    var msg = WA_MESSAGES[lang] || WA_MESSAGES.it;
    document.getElementById('listinoBtn').href = 'https://wa.me/393485180143?text=' + encodeURIComponent(msg);
  }
  updateWhatsAppLink();
  window.addEventListener('i18nchange', updateWhatsAppLink);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#cf7e93">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INGROSSO">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/img/logo.jpg">
<title>BELLA ITALIA · 订货</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #f7dde3;
    --blush-deep: #eec3cf;
    --rose: #cf7e93;
    --rose-deep: #a85068;
    --gold: #c6a15b;
    --gold-soft: #e4cd9a;
    --cream: #fff8f4;
    --ink: #3c2b30;
    --ink-soft: rgba(60,43,48,0.6);
    --line: rgba(60,43,48,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 100px;
  }
  .serif { font-family: 'Cormorant Garamond', serif; }

  header.brand {
    background: linear-gradient(160deg, var(--blush) 0%, var(--blush-deep) 100%);
    padding: 30px 20px 22px;
    border-bottom: 1px solid var(--gold-soft);
    position: relative;
    overflow: hidden;
  }
  header.brand::after {
    content: "";
    position: absolute; right: -30px; top: -30px;
    width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.5), transparent 70%);
  }
  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 0.02em;
    color: var(--rose-deep);
    margin: 0;
    position: relative;
  }
  .brand-tagline {
    font-size: 10.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .brand-meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 16px;
    font-size: 13px;
  }
  #customerName { font-weight: 500; }
  .tier-badge {
    display: inline-block;
    background: var(--gold);
    color: #fff;
    padding: 3px 11px;
    border-radius: 999px;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  main { padding: 16px 14px 4px; }

  .product {
    display: flex; gap: 13px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 13px;
    margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(207,126,147,0.08);
  }
  .product img {
    width: 100px; height: 100px;
    object-fit: cover;
    border-radius: 14px;
    background: var(--blush);
    flex-shrink: 0;
  }
  .product-info { flex: 1; min-width: 0; }
  .product-name { font-weight: 500; font-size: 15px; line-height: 1.3; }
  .product-unit { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .product-bottom {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 9px;
  }
  .product-price { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600; color: var(--rose-deep); }
  .product-price .cur { font-size: 12px; opacity: 0.7; margin-right: 1px; }
  .stock-tag { font-size: 10.5px; margin-top: 4px; letter-spacing: 0.02em; }
  .stock-tag.ok { color: #7c9473; }
  .stock-tag.out { color: var(--rose-deep); font-weight: 500; }

  .stepper {
    display: flex; align-items: center;
    background: var(--blush);
    border-radius: 999px;
    overflow: hidden;
  }
  .stepper button {
    width: 28px; height: 28px;
    border: none; background: transparent;
    font-size: 15px; font-weight: 600;
    color: var(--rose-deep);
  }
  .stepper button:disabled { opacity: 0.3; }
  .stepper input {
    width: 30px; text-align: center;
    border: none; background: transparent;
    height: 28px; font-size: 13px; color: var(--ink);
    -moz-appearance: textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .note-block { padding: 6px 14px 0; }
  .note-block label {
    display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--ink-soft); margin-bottom: 6px;
  }
  .note-block textarea {
    width: 100%; min-height: 58px;
    border: 1px solid var(--line); border-radius: 12px;
    background: #fff; padding: 10px; font-size: 14px;
    font-family: 'Jost', sans-serif; resize: vertical;
  }
  .note-block textarea:focus { outline: 2px solid var(--rose); }

  .cart-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #fff;
    border-top: 1px solid var(--line);
    padding: 13px 16px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 -6px 20px rgba(207,126,147,0.15);
  }
  .cart-bar .total-block .label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
  .cart-bar .total-block .value { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--rose-deep); }
  .cart-bar button {
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    color: #fff; border: none;
    padding: 13px 26px;
    font-size: 13.5px; font-weight: 500; letter-spacing: 0.04em;
    border-radius: 999px;
    box-shadow: 0 4px 12px rgba(168,80,104,0.35);
  }
  .cart-bar button:disabled { opacity: 0.35; box-shadow: none; }

  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff;
    padding: 10px 18px; font-size: 13px;
    border-radius: 999px; z-index: 50;
    max-width: 88%; text-align: center;
  }

  .seal-overlay {
    position: fixed; inset: 0; background: rgba(60,43,48,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 60;
  }
  .seal-card {
    background: var(--cream); border-radius: 20px;
    padding: 30px 24px 24px; width: 82%; max-width: 300px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(60,43,48,0.25);
  }
  .seal {
    width: 64px; height: 64px; margin: 0 auto 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 70%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 26px; font-weight: 600; color: #fff;
    box-shadow: 0 4px 14px rgba(198,161,91,0.5);
  }
  .seal-card .big { font-family: 'Cormorant Garamond', serif; color: var(--rose-deep); font-size: 21px; font-weight: 600; }
  .seal-card .oid { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  .seal-card button {
    margin-top: 20px; border: none; background: var(--blush);
    color: var(--rose-deep); border-radius: 999px;
    padding: 9px 22px; font-size: 13px; font-weight: 500;
  }

  .product img { cursor: zoom-in; }

  .img-zoom-overlay {
    position: fixed; inset: 0; background: rgba(20,12,14,0.88);
    display: flex; align-items: center; justify-content: center;
    z-index: 90; padding: 24px; cursor: zoom-out;
  }
  .img-zoom-overlay img {
    max-width: 100%; max-height: 100%;
    border-radius: 16px;
    box-shadow: 0 12px 50px rgba(0,0,0,0.4);
  }
  .img-zoom-overlay .close-hint {
    position: absolute; top: 18px; right: 20px;
    color: #fff; font-size: 26px; opacity: 0.8;
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  }

  .info-banner {
    margin: 10px 14px 4px;
    background: linear-gradient(135deg, #a85068, #cf7e93);
    color: #fff; border-radius: 14px; padding: 13px 16px;
    font-size: 12.5px; line-height: 1.65;
    box-shadow: 0 3px 12px rgba(168,80,104,0.22);
  }
  .info-banner .min {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px; font-weight: 600;
    letter-spacing: 0.02em; margin-bottom: 4px;
  }
  .info-banner .line { opacity: 0.93; }
  .iva-note {
    margin: 6px 14px 0; font-size: 11px; color: var(--ink-soft);
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .cart-bar .cart-btn {
    position: relative; background: var(--blush); color: var(--rose-deep);
    border: none; border-radius: 999px; padding: 0; width: 44px; height: 44px;
    font-size: 19px; flex-shrink: 0; box-shadow: none; margin-right: 4px;
  }
  .cart-bar .cart-btn:disabled { opacity: 0.35; }
  .cart-badge {
    position: absolute; top: -3px; right: -3px;
    background: var(--rose-deep); color: #fff;
    font-size: 10px; font-weight: 600; min-width: 18px; height: 18px;
    border-radius: 999px; display: flex; align-items: center; justify-content: center;
    padding: 0 4px; border: 2px solid var(--cream);
  }
  .min-warning {
    text-align: center; font-size: 11.5px; color: #b5484c;
    background: #fdeaea; padding: 7px 14px; border-top: 1px solid #f6d6d6;
  }
  .cart-overlay {
    position: fixed; inset: 0; background: rgba(60,43,48,0.5);
    z-index: 95; display: flex; align-items: flex-end;
  }
  .cart-panel {
    background: var(--cream); width: 100%; max-height: 82vh;
    border-radius: 22px 22px 0 0; display: flex; flex-direction: column;
    box-shadow: 0 -8px 40px rgba(60,43,48,0.25);
  }
  .cart-panel .handle { width: 38px; height: 4px; background: #ddd; border-radius: 2px; margin: 10px auto 4px; }
  .cart-panel .head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 18px 12px; border-bottom: 1px solid var(--line);
  }
  .cart-panel .head h3 {
    margin: 0; font-family: 'Cormorant Garamond', serif;
    font-size: 21px; font-weight: 600; color: var(--rose-deep);
  }
  .cart-panel .head button {
    background: none; border: none; font-size: 22px; color: var(--ink-soft); padding: 0 4px;
  }
  .cart-list { overflow-y: auto; padding: 8px 14px 4px; flex: 1; }
  .cart-row {
    display: flex; gap: 11px; align-items: center;
    background: #fff; border: 1px solid var(--line);
    border-radius: 14px; padding: 10px; margin-bottom: 9px;
  }
  .cart-row img { width: 54px; height: 54px; object-fit: cover; border-radius: 10px; flex-shrink: 0; background: var(--blush); }
  .cart-row .ci { flex: 1; min-width: 0; }
  .cart-row .ci .n { font-size: 13px; font-weight: 600; }
  .cart-row .ci .s { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .cart-row .ci .p { font-size: 13px; color: var(--rose-deep); font-weight: 600; margin-top: 3px; }
  .cart-row .ops { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .cart-row .stepper { margin: 0; }
  .cart-row .del { background: none; border: none; color: #c98; font-size: 11px; padding: 0; }
  .cart-empty { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 40px 0; }
  .cart-foot { padding: 12px 18px 22px; border-top: 1px solid var(--line); }
  .cart-foot .sum { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .cart-foot .sum .l { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; }
  .cart-foot .sum .v { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; color: var(--rose-deep); }
</style>
<script>
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isAndroid = /Android/.test(navigator.userAgent);
let deferredPrompt;

if (isAndroid) {
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    showInstallPrompt();
  });
}

if (isIOS) {
  setTimeout(showiOSInstallGuide, 1000);
}

function showInstallPrompt() {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(60,43,48,0.45);display:flex;align-items:center;justify-content:center;z-index:100';
  overlay.innerHTML = `
    <div style="background:#fff8f4;border-radius:20px;padding:30px 24px;width:82%;max-width:320px;text-align:center;box-shadow:0 12px 40px rgba(60,43,48,0.25)">
      <div style="font-size:28px;margin-bottom:12px">📱</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:#a85068;margin-bottom:8px">Aggiungi al telefono</div>
      <div style="font-size:13px;color:#666;margin-bottom:20px;line-height:1.5">Aggiungi questa app alla schermata principale per un accesso rapido ai tuoi ordini</div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button onclick="this.parentElement.parentElement.parentElement.remove()" style="flex:1;padding:10px;background:var(--blush);border:none;border-radius:999px;color:var(--rose-deep);font-weight:500;cursor:pointer">Non adesso</button>
        <button onclick="installApp()" style="flex:1;padding:10px;background:linear-gradient(135deg,#cf7e93,#a85068);border:none;border-radius:999px;color:#fff;font-weight:500;cursor:pointer">Installa</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  setTimeout(() => overlay.remove(), 8000);
}

function showiOSInstallGuide() {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(60,43,48,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding-bottom:0';
  overlay.innerHTML = `
    <div style="background:#fff8f4;border-radius:24px 24px 0 0;padding:28px 24px 40px;width:100%;max-width:480px;box-shadow:0 -8px 40px rgba(60,43,48,0.2)">
      <div style="width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 20px"></div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;color:#a85068;margin-bottom:6px;text-align:center">Aggiungi alla schermata Home</div>
      <div style="font-size:13px;color:#888;text-align:center;margin-bottom:22px">Accedi ai tuoi ordini in un tocco, come un'app</div>

      <div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;background:#fff;border-radius:14px;padding:14px">
        <div style="background:linear-gradient(135deg,#cf7e93,#a85068);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px">①</div>
        <div>
          <div style="font-weight:600;font-size:14px;margin-bottom:3px">Tocca il pulsante Condividi</div>
          <div style="font-size:12px;color:#999">In basso al centro di Safari, il simbolo <strong style="font-size:15px">⎙</strong> (quadrato con freccia su)</div>
        </div>
      </div>

      <div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;background:#fff;border-radius:14px;padding:14px">
        <div style="background:linear-gradient(135deg,#cf7e93,#a85068);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px">②</div>
        <div>
          <div style="font-weight:600;font-size:14px;margin-bottom:3px">Scorri e tocca</div>
          <div style="font-size:12px;color:#999">"<strong>Aggiungi alla schermata Home</strong>" nel menu che si apre</div>
        </div>
      </div>

      <div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:24px;background:#fff;border-radius:14px;padding:14px">
        <div style="background:linear-gradient(135deg,#cf7e93,#a85068);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px">③</div>
        <div>
          <div style="font-weight:600;font-size:14px;margin-bottom:3px">Tocca "Aggiungi"</div>
          <div style="font-size:12px;color:#999">L'icona di Bella Italia apparirà sulla tua schermata Home</div>
        </div>
      </div>

      <button onclick="this.parentElement.parentElement.remove()" style="width:100%;padding:14px;background:linear-gradient(135deg,#cf7e93,#a85068);border:none;border-radius:999px;color:#fff;font-size:15px;font-weight:500;cursor:pointer">Ho capito ✓</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

async function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') {
    toast('App aggiunta alla schermata principale!');
  }
  deferredPrompt = null;
  document.querySelector('[style*="background:rgba"]')?.remove();
}

window.addEventListener('appinstalled', () => {
  console.log('App installata con successo');
});
</script>
</head>
<body>
<div id="profileOverlay" style="display:none;position:fixed;inset:0;background:#fff8f4;z-index:80;overflow-y:auto;padding:24px 18px 40px">
  <p style="font-family:'Cormorant Garamond',serif;font-style:italic;color:#a85068;font-size:24px;margin:0 0 4px">Bella Italia</p>
  <p style="font-size:12px;color:#888;margin-bottom:20px">Prima di ordinare, compila i dati per la fatturazione</p>
  <div style="margin-bottom:12px"><label style="display:block;font-size:12px;font-weight:500;margin-bottom:4px">Ragione Sociale *</label><input id="pf_ragione_sociale" style="width:100%;padding:10px;border:1px solid #e2ddd4;border-radius:10px;font-size:14px;box-sizing:border-box"></div>
  <div style="margin-bottom:12px"><label style="display:block;font-size:12px;font-weight:500;margin-bottom:4px">P.IVA *</label><input id="pf_piva" style="width:100%;padding:10px;border:1px solid #e2ddd4;border-radius:10px;font-size:14px;box-sizing:border-box"></div>
  <div style="margin-bottom:12px"><label style="display:block;font-size:12px;font-weight:500;margin-bottom:4px">Codice Fiscale</label><input id="pf_codice_fiscale" style="width:100%;padding:10px;border:1px solid #e2ddd4;border-radius:10px;font-size:14px;box-sizing:border-box"></div>
  <div style="margin-bottom:12px"><label style="display:block;font-size:12px;font-weight:500;margin-bottom:4px">Indirizzo *</label><input id="pf_indirizzo" style="width:100%;padding:10px;border:1px solid #e2ddd4;border-radius:10px;font-size:14px;box-sizing:border-box"></div>
  <div style="margin-bottom:12px"><label style="display:block;font-size:12px;font-weight:500;margin-bottom:4px">CAP *</label><input id="pf_cap" style="width:100%;padding:10px;border:1px solid #e2ddd4;border-radius:10px;font-size:14px;box-sizing:border-box"></div>
  <div style="margin-bottom:12px"><label style="display:block;font-size:12px;font-weight:500;margin-bottom:4px">Citta *</label><input id="pf_citta" style="width:100%;padding:10px;border:1px solid #e2ddd4;border-radius:10px;font-size:14px;box-sizing:border-box"></div>
  <div style="margin-bottom:12px"><label style="display:block;font-size:12px;font-weight:500;margin-bottom:4px">SDI *</label><input id="pf_sdi" style="width:100%;padding:10px;border:1px solid #e2ddd4;border-radius:10px;font-size:14px;box-sizing:border-box"></div>
  <div style="margin-bottom:12px"><label style="display:block;font-size:12px;font-weight:500;margin-bottom:4px">PEC *</label><input id="pf_pec" style="width:100%;padding:10px;border:1px solid #e2ddd4;border-radius:10px;font-size:14px;box-sizing:border-box"></div>
  <div style="margin-bottom:12px"><label style="display:block;font-size:12px;font-weight:500;margin-bottom:4px">Telefono *</label><input id="pf_telefono" style="width:100%;padding:10px;border:1px solid #e2ddd4;border-radius:10px;font-size:14px;box-sizing:border-box"></div>
  <div style="margin-bottom:12px"><label style="display:block;font-size:12px;font-weight:500;margin-bottom:4px">Email *</label><input id="pf_email" style="width:100%;padding:10px;border:1px solid #e2ddd4;border-radius:10px;font-size:14px;box-sizing:border-box"></div>
  <button id="profileSubmit" onclick="submitProfile()" style="width:100%;padding:14px;background:linear-gradient(135deg,#cf7e93,#a85068);color:#fff;border:none;border-radius:999px;font-size:15px;font-weight:500;margin-top:8px">Salva e continua</button>
</div>

<header class="brand">
  <p class="brand-name">Bella Italia</p>
  <div class="brand-tagline">Cosmetics Wholesale · Ingrosso Cosmetici</div>
  <div class="brand-meta">
    <span id="customerName">加载中…</span>
    
  </div>
</header>

<div class="info-banner">
  <div class="min">ORDINE MINIMO €300</div>
  <div class="line">🚚 SPEDIZIONE €15 fino a 25kg in tutto Italia 🇮🇹</div>
  <div class="line">🌍 SPEDIZIONE IN TUTTO EUROPA!</div>
</div>
<div class="iva-note">Prezzo non compreso IVA</div>

<main id="mainView">
  <!-- 商品列表由 JS 渲染 -->
</main>

<div class="note-block">
  <label>Note / Istruzioni di consegna</label>
  <textarea id="note" placeholder="Es: consegnare entro venerdì, corriere espresso..."></textarea>
</div>

<div id="minWarning" class="min-warning" style="display:none"></div>
<div class="cart-bar">
  <button class="cart-btn" id="cartBtn" onclick="openCart()" disabled>
    🛒<span class="cart-badge" id="cartBadge" style="display:none">0</span>
  </button>
  <div class="total-block">
    <div class="label">Totale (IVA escl.)</div>
    <div class="value">€ <span id="totalValue">0.00</span></div>
  </div>
  <button id="submitBtn" onclick="submitOrder()" disabled>Invia Ordine</button>
</div>

<script>
const token = location.pathname.split('/o/')[1] || location.pathname.split('/').pop();

function money(n) { return n.toFixed(2); }

// 从规格文字里提取"每件数量",比如 "盒(24支/盒)" -> 24, "箱(30包/箱)" -> 30
// 提取不到就当作 1(按件卖)
function packSize(unit) {
  if (!unit) return 1;
  const m = String(unit).match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 1;
}

let PRODUCTS = [];
let CATEGORIES = [];
const cart = {};

let currentView = 'cats'; // 'cats' | 'products'
let currentCat = null;

function renderCats() {
  currentView = 'cats';
  const main = document.getElementById('mainView');
  if (CATEGORIES.length === 0) {
    main.innerHTML = PRODUCTS.map(productCard).join('') || '<p style="text-align:center;color:#aaa;padding:30px;font-size:13px">Nessun prodotto</p>';
    return;
  }
  main.innerHTML = CATEGORIES.map(c => {
    const inCat = PRODUCTS.filter(p => String(p.category_id) === String(c.id));
    if (inCat.length === 0) return '';
    const cover = inCat.find(p => p.image && !p.image.includes('placehold'));
    const imgSrc = cover ? cover.image : (inCat[0].image || '');
    const imgHTML = imgSrc
      ? `<img src="${imgSrc}" style="width:88px;height:88px;object-fit:cover;border-radius:14px;flex-shrink:0">`
      : `<div style="width:88px;height:88px;border-radius:14px;background:linear-gradient(135deg,#f7dde3,#eec3cf);flex-shrink:0"></div>`;
    return `<div onclick="openCat(${c.id}, '${c.name.replace(/'/g,"")}')" style="display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #f0e6ea;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(207,126,147,0.08);cursor:pointer">
      ${imgHTML}
      <div style="flex:1">
        <div style="font-weight:600;font-size:15px">${c.name}</div>
        <div style="font-size:12px;color:#aaa;margin-top:2px">${inCat.length} articoli</div>
      </div>
      <div style="color:#cf7e93;font-size:18px">›</div>
    </div>`;
  }).join('');
}

function openCat(id, name) {
  currentView = 'products';
  currentCat = id;
  const main = document.getElementById('mainView');
  const filtered = PRODUCTS.filter(p => String(p.category_id) === String(id));
  main.innerHTML = `
    <div onclick="renderCats()" style="display:flex;align-items:center;gap:8px;padding:10px 4px 14px;cursor:pointer;color:#a85068;font-size:14px;font-weight:500">
      ‹ <span>Tutti</span>
    </div>
    <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:#a85068;margin-bottom:12px">${name}</div>
    ${filtered.map(productCard).join('') || '<p style="text-align:center;color:#aaa;padding:30px;font-size:13px">Nessun prodotto in questa categoria</p>'}
  `;
}

function productCard(p) {
  const pack = packSize(p.unit);
  const availablePacks = Math.floor(p.stock / pack);
  const out = availablePacks <= 0;
  return `
    <div class="product">
      <img src="${p.image || 'https://placehold.co/160x160'}" alt="" onclick="event.stopPropagation();zoomImage('${(p.image || 'https://placehold.co/800x800').replace(/'/g, '')}', '${p.name.replace(/'/g, '')}')">
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-unit">${p.unit}</div>
        <div class="stock-tag ${out ? 'out' : 'ok'}">${out ? 'Esaurito (scorta inferiore a una confezione)' : availablePacks + ' confezioni disponibili · ' + pack + ' pz/confezione'}</div>
        <div class="product-bottom">
          <div class="product-price"><span class="cur">€</span>${money(p.price)}<span style="font-size:11px;color:var(--ink-soft);font-weight:400"> /pz</span></div>
          <div class="stepper">
            <button onclick="changeQty('${p.id}', -${pack})" ${out ? 'disabled' : ''}>−</button>
            <input type="number" min="0" step="${pack}" max="${p.stock}" value="${cart[p.id] || 0}" data-pid="${p.id}"
                   onchange="setQty('${p.id}', this.value)" ${out ? 'disabled' : ''}>
            <button onclick="changeQty('${p.id}', ${pack})" ${out ? 'disabled' : ''}>+</button>
          </div>
        </div>
      </div>
    </div>`;
}

function getQtyInput(id) {
  return document.querySelector(`input[data-pid="${id}"]`);
}

function updateCartUI(id) {
  const input = getQtyInput(id);
  if (input) input.value = cart[id] || 0;
  updateTotals();
  if (document.getElementById('cartOverlay')) renderCartList();
}

const MIN_ORDER = 300;

function cartTotal() {
  let total = 0;
  for (const id in cart) {
    const qty = cart[id];
    if (!qty) continue;
    const p = PRODUCTS.find(x => x.id === id);
    if (p) total += p.price * qty;
  }
  return total;
}

function cartLines() {
  return Object.keys(cart)
    .filter(id => cart[id] > 0)
    .map(id => ({ id, qty: cart[id], p: PRODUCTS.find(x => x.id === id) }))
    .filter(l => l.p);
}

function updateTotals() {
  const total = cartTotal();
  const lines = cartLines();
  document.getElementById('totalValue').textContent = money(total);

  const badge = document.getElementById('cartBadge');
  const cartBtn = document.getElementById('cartBtn');
  if (badge && cartBtn) {
    badge.textContent = lines.length;
    badge.style.display = lines.length ? 'flex' : 'none';
    cartBtn.disabled = lines.length === 0;
  }

  const warn = document.getElementById('minWarning');
  const missing = MIN_ORDER - total;
  if (warn) {
    if (total > 0 && missing > 0) {
      warn.textContent = `Mancano €${money(missing)} per raggiungere l'ordine minimo di €${MIN_ORDER}`;
      warn.style.display = 'block';
    } else {
      warn.style.display = 'none';
    }
  }

  document.getElementById('submitBtn').disabled = total < MIN_ORDER;
  const cf = document.getElementById('cartFootTotal');
  if (cf) cf.textContent = money(total);
  const cs = document.getElementById('cartSubmitBtn');
  if (cs) cs.disabled = total < MIN_ORDER;
}

function openCart() {
  if (document.getElementById('cartOverlay')) return;
  const ov = document.createElement('div');
  ov.className = 'cart-overlay';
  ov.id = 'cartOverlay';
  ov.onclick = (e) => { if (e.target === ov) closeCart(); };
  ov.innerHTML = `
    <div class="cart-panel">
      <div class="handle"></div>
      <div class="head">
        <h3>Il tuo ordine</h3>
        <button onclick="closeCart()">&times;</button>
      </div>
      <div class="cart-list" id="cartList"></div>
      <div class="cart-foot">
        <div class="sum">
          <span class="l">Totale (IVA escl.)</span>
          <span class="v">€ <span id="cartFootTotal">0.00</span></span>
        </div>
        <button id="cartSubmitBtn" onclick="closeCart();submitOrder()" style="width:100%;padding:13px;border:none;border-radius:999px;background:linear-gradient(135deg,#cf7e93,#a85068);color:#fff;font-size:15px;font-weight:500">Invia Ordine</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  renderCartList();
  updateTotals();
}

function closeCart() {
  document.getElementById('cartOverlay')?.remove();
}

function renderCartList() {
  const list = document.getElementById('cartList');
  if (!list) return;
  const lines = cartLines();
  if (lines.length === 0) {
    list.innerHTML = '<div class="cart-empty">Il carrello è vuoto</div>';
    return;
  }
  list.innerHTML = lines.map(({ id, qty, p }) => {
    const pack = packSize(p.unit);
    return `
    <div class="cart-row">
      <img src="${p.image || 'https://placehold.co/160x160'}" alt="">
      <div class="ci">
        <div class="n">${p.name}</div>
        <div class="s">${p.unit || ''} · €${money(p.price)}/pz</div>
        <div class="p">€${money(p.price * qty)}</div>
      </div>
      <div class="ops">
        <div class="stepper">
          <button onclick="changeQty('${id}', -${pack})">−</button>
          <input type="number" min="0" step="${pack}" value="${qty}" onchange="setQty('${id}', this.value)">
          <button onclick="changeQty('${id}', ${pack})">+</button>
        </div>
        <button class="del" onclick="removeFromCart('${id}')">Rimuovi</button>
      </div>
    </div>`;
  }).join('');
}

function removeFromCart(id) {
  delete cart[id];
  const input = getQtyInput(id);
  if (input) input.value = 0;
  updateTotals();
  renderCartList();
}

function changeQty(id, delta) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  const pack = packSize(p.unit);
  const current = cart[id] || 0;
  let next = current + delta;
  if (next < 0) next = 0;
  if (p.stock != null && next > p.stock) next = p.stock;
  next = Math.floor(next / pack) * pack; // 保证永远是整件的倍数
  if (next === 0) delete cart[id]; else cart[id] = next;
  updateCartUI(id);
}

function setQty(id, value) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  const pack = packSize(p.unit);
  let next = parseInt(value, 10);
  if (isNaN(next) || next < 0) next = 0;
  next = Math.round(next / pack) * pack; // 手动输入时也吸附到整件的倍数
  if (p.stock != null && next > p.stock) next = Math.floor(p.stock / pack) * pack;
  if (next === 0) delete cart[id]; else cart[id] = next;
  updateCartUI(id);
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function zoomImage(src, alt) {
  const overlay = document.createElement('div');
  overlay.className = 'img-zoom-overlay';
  overlay.onclick = () => overlay.remove();
  overlay.innerHTML = `<span class="close-hint">✕</span><img src="${src}" alt="${alt || ''}">`;
  document.body.appendChild(overlay);
}

async function submitOrder() {
  const items = Object.keys(cart).filter(id => cart[id] > 0).map(id => ({ id, qty: cart[id] }));
  if (items.length === 0) return;
  if (cartTotal() < MIN_ORDER) {
    toast(`Ordine minimo €${MIN_ORDER}`);
    return;
  }
  const note = document.getElementById('note').value.trim();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = 'Invio…';
  try {
    const res = await fetch('/api/order/' + token, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items, note }),
    });
    const data = await res.json();
    if (!res.ok) {
      toast(data.error || "Errore nell'invio");
      btn.disabled = false; btn.textContent = originalText;
      return;
    }
    showSuccess(data);
  } catch (e) {
    toast('Errore di rete, riprova');
    btn.disabled = false; btn.textContent = originalText;
  }
}

function showSuccess(data) {
  const overlay = document.createElement('div');
  overlay.className = 'seal-overlay';
  overlay.innerHTML = `
    <div class="seal-card">
      <div class="seal">✓</div>
      <div class="big">Ordine inviato!</div>
      <div class="oid">N. Ordine: ${String(data.orderId).slice(0,8)}<br>Totale: €${money(data.total)}</div>
      <button onclick="location.reload()">Chiudi</button>
    </div>`;
  document.body.appendChild(overlay);
}

async function load() {
  try {
    const res = await fetch('/api/customer/' + token);
    const data = await res.json();
    if (!res.ok) {
      document.getElementById('customerName').textContent = data.error || 'Errore di caricamento';
      return;
    }
    if (data.needProfile) {
      document.getElementById('profileOverlay').style.display = 'block';
      return;
    }
    document.getElementById('customerName').textContent = data.customer.name;
    PRODUCTS = data.products;
    CATEGORIES = data.categories || [];
    renderCats();
  } catch (e) {
    document.getElementById('customerName').textContent = 'Errore di caricamento';
  }
}

async function submitProfile() {
  const val = id => document.getElementById(id).value.trim();
  const payload = {
    ragione_sociale: val('pf_ragione_sociale'),
    piva: val('pf_piva'),
    codice_fiscale: val('pf_codice_fiscale'),
    indirizzo: val('pf_indirizzo'),
    cap: val('pf_cap'),
    citta: val('pf_citta'),
    sdi: val('pf_sdi'),
    pec: val('pf_pec'),
    telefono: val('pf_telefono'),
    email: val('pf_email'),
  };
  const btn = document.getElementById('profileSubmit');
  btn.disabled = true; btn.textContent = 'Salvataggio…';
  try {
    const res = await fetch('/api/customer/' + token + '/profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) { toast(data.error || 'Errore nel salvataggio'); btn.disabled = false; btn.textContent = 'Salva e continua'; return; }
    document.getElementById('profileOverlay').style.display = 'none';
    load();
  } catch (e) {
    toast('Errore di rete, riprova'); btn.disabled = false; btn.textContent = 'Salva e continua';
  }
}

function render() { renderCats(); }

load();

</script>
</body>
</html>

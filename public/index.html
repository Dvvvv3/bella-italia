<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BELLA ITALIA — Ingrosso Cosmetici</title>
<meta name="description" content="Ingrosso cosmetici e profumi. Trucchi, profumi, accessori e skincare. Richiedi il listino su WhatsApp.">
<meta name="theme-color" content="#fdeeea">
<script src="/js/i18n.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #fdeeea;
    touch-action: manipulation;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .art-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    line-height: 0;
  }
  .art-wrap img { width: 100%; height: auto; display: block; }
  .listino-hit {
    position: absolute;
    left: 13%;
    top: 30.5%;
    width: 60%;
    height: 9.5%;
  }
  footer {
    padding: 18px 20px max(18px, env(safe-area-inset-bottom));
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 12.5px;
    color: rgba(74,29,41,0.55);
  }
  footer a { color: inherit; }
</style>
</head>
<body>

<div class="art-wrap">
  <img src="/img/homepage.webp" alt="Bella Italia — Ingrosso cosmetici e profumi">
  <a class="listino-hit" id="listinoBtn" href="#" target="_blank" rel="noopener" aria-label="Richiedi il listino su WhatsApp"></a>
</div>

<footer>
  <a href="privacy.html">Privacy</a>
  &nbsp;·&nbsp;
  <a href="contact.html">Contatti</a>
</footer>

<script>
  var WA_MESSAGES = {
    it: "Ciao! Vorrei ricevere il listino prezzi 😊",
    en: "Hi! I'd like to receive the price list 😊",
    fr: "Bonjour ! Je voudrais recevoir la liste des prix 😊",
    es: "¡Hola! Me gustaría recibir la lista de precios 😊"
  };
  function updateWhatsAppLink() {
    var lang = (window.I18N && I18N.getLang) ? I18N.getLang() : 'it';
    var msg = WA_MESSAGES[lang] || WA_MESSAGES.it;
    document.getElementById('listinoBtn').href = 'https://wa.me/393485180143?text=' + encodeURIComponent(msg);
  }
  updateWhatsAppLink();
  window.addEventListener('i18nchange', updateWhatsAppLink);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>后台管理 · BELLA ITALIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<script src="/js/qrcode.min.js"></script>
<script src="/js/html2canvas.min.js"></script>
<style>
  :root { --ink: #2a2a2a; --line: #e2ddd4; --bg: #faf8f4; --card: #fff; --accent: #a85068; --accent-soft: #f7dde3; --ok: #3f6b4f; --danger: #b23a2e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; touch-action: manipulation; }
  header { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 17px; margin: 0; }
  header .status { font-size: 12px; color: #888; }
  nav { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { border: 1px solid var(--line); background: var(--card); padding: 7px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; }
  nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { padding: 14px; max-width: 720px; margin: 0 auto; }
  section { display: none; }
  section.active { display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > div { flex: 1; min-width: 90px; }
  label { display: block; font-size: 11px; color: #888; margin-bottom: 3px; }
  input, select { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
  img.thumb { width: 42px; height: 42px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
  .item-title { font-weight: 600; font-size: 14px; }
  .item-sub { font-size: 12px; color: #888; margin-top: 2px; }
  .prod-facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .prod-facts > div { display: flex; flex-direction: column; }
  .f-label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 0.04em; }
  .f-val { font-size: 14px; font-weight: 600; margin-top: 2px; }
  .f-danger { color: var(--danger); }
  .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  button.btn { border: none; border-radius: 6px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--accent-soft); color: var(--accent); }
  .drag-handle { cursor: grab; touch-action: none; padding: 6px 8px; color: #ccc; font-size: 16px; user-select: none; flex-shrink: 0; }
  .cat-card.dragging { opacity: .55; box-shadow: 0 8px 20px rgba(0,0,0,.15); }
  .cat-card.drop-target { border: 2px dashed var(--accent); }
  .btn-danger { background: #fbe6e2; color: var(--danger); }
  .add-form { border: 1px dashed var(--line); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
  .add-form h3 { margin: 0 0 10px; font-size: 13px; }
  .badge { display: inline-block; font-size: 10.5px; padding: 2px 8px; border-radius: 999px; }
  .badge.pending { background: #fdf0dc; color: #a06a1a; }
  .badge.confirmed { background: #e3f0e6; color: var(--ok); }
  .badge.shipped { background: #e5e8f5; color: #4a5aa8; }
  .mono { font-family: monospace; }
  .gate { position: fixed; inset: 0; background: rgba(60,43,48,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .gate-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; width: 84%; max-width: 380px; }
  .gate-card h2 { font-size: 16px; margin: 0 0 14px; }
  .modal-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; width: 90%; max-width: 440px; max-height: 85vh; overflow-y: auto; }
  .profile-row { font-size: 13px; line-height: 1.8; }
  .profile-row b { color: #555; font-weight: 500; }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-card" style="text-align:center">
    <h2>BELLA ITALIA 后台</h2>
    <input type="password" id="keyInput" placeholder="输入管理密钥" style="margin-bottom:10px">
    <button class="btn btn-primary" style="width:100%" onclick="unlock()">进入</button>
  </div>
</div>
<header>
  <h1>BELLA ITALIA 后台</h1>
  <span class="status" id="statusMsg"></span>
</header>
<nav>
  <button class="active" data-tab="products">商品</button>
  <button data-tab="categories">分类</button>
  <button data-tab="customers">客户</button>
  <button data-tab="orders">订单</button>
</nav>
<main>
  <section id="products" class="active">
    <div class="add-form">
      <h3>新增商品</h3>
      <div class="row">
        <div><label>编号</label><input id="p_id" placeholder="sku004"></div>
        <div><label>名称(客户可见)</label><input id="p_name" placeholder="精华液 30ml"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <div><label>中文备注名(仅后台可见)</label><input id="p_name_cn" placeholder="内部方便查找用,客户看不到"></div>
        <div><label>条码</label><input id="p_barcode" placeholder="可用扫码枪直接扫入"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <div><label>分类</label><select id="p_category"></select></div>
      </div>
      <div class="row" style="margin-top:8px">
        <div><label>规格单位</label><input id="p_unit" placeholder="箱(20瓶/箱)"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <div><label>价格 €</label><input id="p_price" type="number" step="0.01"></div>
      </div>
      <div style="margin-top:8px">
        <label>商品图片</label>
        <input type="file" id="p_image_file" accept="image/*" onchange="uploadImage(this,'p_image_url','p_image_preview')">
        <img id="p_image_preview" class="thumb" style="margin-top:6px;display:none">
        <input type="hidden" id="p_image_url">
      </div>
      <div style="margin-top:8px">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="p_new_arrival" style="width:auto">
          ✨ 加入 New Arrivals(不影响它原本的分类)
        </label>
      </div>
      <button class="btn btn-primary" style="margin-top:10px" onclick="addProduct()">添加商品</button>
    </div>
    <div id="productList" style="display:none"></div>
  </section>
  <section id="categories">
    <div class="add-form" style="border-color:var(--accent);background:var(--accent-soft)">
      <h3>📷 扫码查找 / 快速定位</h3>
      <input id="scanInput" placeholder="扫条码,或直接输入商品编号(如sku001)后回车" autocomplete="off">
    </div>
    <div class="add-form">
      <h3>新增分类</h3>
      <div class="row">
<div><label>分类名称</label><input id="cat_name" placeholder="ROSSETTO"></div>
        <div style="max-width:80px"><label>排序</label><input id="cat_sort" type="number" value="0"></div>
      </div>
      <div style="margin-top:8px">
        <label>分类图片(可选)</label>
        <input type="file" id="cat_image_file" accept="image/*" onchange="uploadImage(this,'cat_image_url','cat_image_preview')" style="margin-top:4px">
        <img id="cat_image_preview" class="thumb" style="margin-top:6px;display:none">
        <input type="hidden" id="cat_image_url">
      </div>
      <div style="margin-top:8px">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="cat_show_new_arrivals" style="width:auto">
          ✨ 设为 New Arrivals 虚拟文件夹(展示所有标了"加入New Arrivals"的商品,而不是按分类)
        </label>
      </div>
      <button class="btn btn-primary" style="margin-top:10px" onclick="addCategory()">添加分类</button>
    </div>
    <div id="categoryList"></div>
  </section>
  <section id="customers">
    <div class="add-form" style="border-color:var(--accent);background:var(--accent-soft)">
      <h3 style="display:flex;justify-content:space-between;align-items:center">
        👀 访客记录
        <button class="btn btn-ghost" style="font-size:11px;padding:4px 10px" onclick="loadVisitorLog()">刷新</button>
      </h3>
      <div id="visitorLog" style="max-height:260px;overflow-y:auto;margin-top:6px"></div>
    </div>
    <div class="add-form">
      <h3>新增客户(自动生成免密下单链接)</h3>
      <div class="row">
        <div><label>客户名称</label><input id="c_name" placeholder="王老板 - 佛罗伦萨"></div>
        <div><label>价格等级</label><select id="c_tier"><option value="A">普通</option></select></div>
      </div>
      <button class="btn btn-primary" style="margin-top:10px" onclick="addCustomer()">生成链接</button>
    </div>
    <div id="customerList"></div>
  </section>
  <section id="orders">
    <div style="display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px">
      <button class="btn btn-primary" id="tab_pending" onclick="setOrderTab('pending')">新订单</button>
      <button class="btn btn-ghost" id="tab_shipped" onclick="setOrderTab('shipped')">已发货</button>
      <button class="btn btn-ghost" id="tab_cancelled" onclick="setOrderTab('cancelled')">废弃订单</button>
    </div>
    <div id="orderList"></div>
  </section>
</main>
<div class="gate" id="editModal" style="display:none">
  <div class="gate-card" style="max-width:380px">
    <h2 style="margin-bottom:12px;display:flex;align-items:center;gap:8px">编辑商品 <span id="e_status_badge"></span></h2>
    <input type="hidden" id="e_id_original">
    <label>编号 <span style="color:#c0392b;font-weight:400;font-size:11px">(修改会同步更新历史订单)</span></label>
    <input id="e_id" style="margin-bottom:8px">
    <label>名称(客户可见)</label><input id="e_name" style="margin-bottom:8px">
    <label>中文备注名(仅后台可见)</label><input id="e_name_cn" style="margin-bottom:8px">
    <label>条码</label><input id="e_barcode" style="margin-bottom:8px">
    <label>分类</label><select id="e_category" style="margin-bottom:8px"></select>
    <label>规格单位</label><input id="e_unit" style="margin-bottom:8px">
    <div class="row" style="margin-bottom:8px">
      <div><label>价格 €</label><input id="e_price" type="number" step="0.01"></div>
    </div>
    <label>商品图片</label>
    <input type="file" id="e_image_file" accept="image/*" onchange="uploadImage(this,'e_image_url','e_image_preview')" style="margin-bottom:6px">
    <img id="e_image_preview" class="thumb" style="margin-bottom:8px">
    <input type="hidden" id="e_image_url">
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:8px">
      <input type="checkbox" id="e_new_arrival" style="width:auto">
      ✨ 加入 New Arrivals(不影响它原本的分类)
    </label>
    <div class="actions">
      <button class="btn btn-ghost" onclick="closeEdit()">取消</button>
      <button class="btn" id="e_toggle_btn" onclick="toggleActiveFromEdit()">缺货/下架</button>
      <button class="btn btn-primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>
<div class="gate" id="catEditModal" style="display:none">
  <div class="gate-card" style="max-width:380px">
    <h2 style="margin-bottom:12px">编辑分类</h2>
    <input type="hidden" id="ec_id">
    <label>分类名称</label><input id="ec_name" style="margin-bottom:8px">
    <label>排序</label><input id="ec_sort" type="number" style="margin-bottom:8px">
    <label>分类封面图片</label>
    <div style="font-size:11px;color:#aaa;margin-bottom:6px">设置后客户下单页的文件夹封面使用此图,不设置则自动取该分类第一个有图的商品</div>
    <input type="file" id="ec_image_file" accept="image/*" onchange="uploadImage(this,'ec_image_url','ec_image_preview')" style="margin-bottom:6px">
    <img id="ec_image_preview" class="thumb" style="margin-bottom:8px">
    <input type="hidden" id="ec_image_url">
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:8px">
      <input type="checkbox" id="ec_show_new_arrivals" style="width:auto">
      ✨ 设为 New Arrivals 虚拟文件夹
    </label>
    <div class="actions">
      <button class="btn btn-ghost" onclick="document.getElementById('catEditModal').style.display='none'">取消</button>
      <button class="btn btn-danger" onclick="clearCatImage()">清除图片</button>
      <button class="btn btn-primary" onclick="saveCatEdit()">保存</button>
    </div>
  </div>
</div>
<div class="gate" id="qrCardModal" style="display:none">
  <div class="gate-card" style="max-width:380px;padding:0;background:transparent;border:none;box-shadow:none">
    <div id="qrCardWrap"></div>
    <div id="qrCardHint" style="text-align:center;font-size:12.5px;color:#a87a00;margin-top:10px;display:none">👆 长按上面的图片,选择「存储图像」保存到相册</div>
    <div class="actions" style="justify-content:center;margin-top:14px">
      <button class="btn btn-ghost" onclick="document.getElementById('qrCardModal').style.display='none'">关闭</button>
    </div>
  </div>
</div>
<div class="gate" id="custModal" style="display:none">
  <div class="modal-card">
    <h2 id="cust_title" style="margin:0 0 12px;font-size:16px"></h2>
    <div id="cust_profile" class="profile-row"></div>
    <h3 style="font-size:13px;margin:16px 0 8px">历史订单</h3>
    <div id="cust_orders"></div>
    <h3 style="font-size:13px;margin:16px 0 8px">访问记录</h3>
    <div id="cust_access" style="max-height:180px;overflow-y:auto"></div>
    <div class="actions" style="margin-top:14px">
      <button class="btn btn-ghost" onclick="document.getElementById('custModal').style.display='none'">关闭</button>
    </div>
  </div>
</div>
<script>
let ADMIN_KEY = localStorage.getItem('adminKey') || '';
let CATEGORIES = [];
function unlock() {
  ADMIN_KEY = document.getElementById('keyInput').value.trim();
  if (!ADMIN_KEY) return;
  localStorage.setItem('adminKey', ADMIN_KEY);
  document.getElementById('gate').style.display = 'none';
  loadAll();
}
if (ADMIN_KEY) document.getElementById('gate').style.display = 'none';
async function api(path, opts={}) {
  const res = await fetch(path, { ...opts, headers: {'Content-Type':'application/json','x-admin-key':ADMIN_KEY,...(opts.headers||{})} });
  const data = await res.json();
  if (!res.ok) { if (res.status===401){localStorage.removeItem('adminKey');location.reload();} throw new Error(data.error||'请求失败'); }
  return data;
}
function flash(msg) { const el=document.getElementById('statusMsg'); el.textContent=msg; setTimeout(()=>{if(el.textContent===msg)el.textContent='';},2500); }
// 数据库里存的是 UTC 时间;SQLite 自动写入的格式没带时区标记("2026-09-03 10:00:00"),
// 浏览器会误当成本地时间解析,导致显示的时间跟实际差几个小时。这里统一按 UTC 解析,
// 再强制转换成意大利(那不勒斯)本地时间显示,不受管理员自己设备所在时区影响。
function fmtTime(s) {
  if (!s) return '';
  const iso = s.includes('T') ? s : s.replace(' ', 'T') + 'Z';
  const d = new Date(iso);
  if (isNaN(d)) return s;
  return d.toLocaleString('zh-CN', { timeZone: 'Europe/Rome', hour12: false });
}
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});
async function loadCategoryCache() {
  CATEGORIES = await api('/api/admin/categories');
  const opts = '<option value="">— 未分类 —</option>' + CATEGORIES.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  ['p_category','e_category'].forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML=opts; });
}
let ALL_PRODUCTS = [];
let currentProductTab = 'active';
function setProductTab(tab) {
  currentProductTab = tab;
  ['active','inactive'].forEach(t => {
    const btn = document.getElementById('ptab_'+t);
    if (btn) btn.className = 'btn ' + (t===tab ? 'btn-primary' : 'btn-ghost');
  });
  renderProductList();
}
async function loadProducts() {
  const products = await api('/api/admin/products');
  ALL_PRODUCTS = products;
  renderProductList();
  if (typeof renderCategoryList === 'function' && CATEGORIES) renderCategoryList();
}
function renderProductList() {
  const filtered = ALL_PRODUCTS.filter(p => {
    const statusOk = currentProductTab==='inactive' ? p.active===0 : p.active!==0;
    const catOk = !p.category_id;
    return statusOk && catOk;
  });
  document.getElementById('productList').innerHTML = filtered.map(p=>`
    <div class="card">
      <div class="row" style="align-items:flex-start">
        <img class="thumb" style="width:56px;height:56px" src="${p.image||'https://placehold.co/80x80'}" alt="">
        <div style="flex:1">
          <div class="item-title">${p.name} ${p.active===0?'<span class="badge" style="background:#fbe6e2;color:#c0392b">已下架</span>':''} ${p.is_new_arrival?'<span class="badge" style="background:#fff3d6;color:#a87a00">✨ New Arrivals</span>':''}</div>
          ${p.name_cn?`<div style="font-size:12px;color:var(--accent);margin-top:1px">🈶 ${p.name_cn}</div>`:''}
          <div class="item-sub" style="margin-top:3px">
            ${p.category_name?`<span class="badge confirmed">${p.category_name}</span>`:'<span class="badge pending">未分类</span>'}
            <span class="mono" style="color:#aaa;font-size:11px"> ${p.id}</span>
            ${p.barcode?`<span class="mono" style="color:#aaa;font-size:11px"> · 条码 ${p.barcode}</span>`:''}
          </div>
        </div>
      </div>
      <div class="prod-facts">
        <div><span class="f-label">规格</span><span class="f-val" style="font-size:12px">${p.unit||'—'}</span></div>
        <div><span class="f-label">价格</span><span class="f-val">€${p.price}</span></div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="editProduct('${p.id}')">编辑</button>
        <button class="btn ${p.is_new_arrival?'btn-primary':'btn-ghost'}" onclick="toggleNewArrival('${p.id}')">${p.is_new_arrival?'✨ 移出New Arrivals':'✨ 加入New Arrivals'}</button>
        <button class="btn ${p.active===0?'btn-primary':'btn-danger'}" onclick="toggleActive('${p.id}')">${p.active===0?'重新上架':'缺货/下架'}</button>
        <button class="btn btn-danger" onclick="deleteProduct('${p.id}')">删除</button>
      </div>
    </div>`).join('') || `<p style="color:#888;font-size:13px">${currentProductTab==='inactive'?'没有已下架的商品':'还没有商品'}</p>`;
}
async function uploadImage(inputEl,urlFieldId,previewId) {
  const file=inputEl.files[0]; if(!file) return;
  const fd=new FormData(); fd.append('image',file);
  try {
    const res=await fetch('/api/admin/upload',{method:'POST',headers:{'x-admin-key':ADMIN_KEY},body:fd});
    const data=await res.json(); if(!res.ok) throw new Error(data.error);
    document.getElementById(urlFieldId).value=data.url;
    const pr=document.getElementById(previewId); pr.src=data.url; pr.style.display='inline-block';
    flash('图片已上传');
  } catch(e){alert('上传失败:'+e.message);}
}
async function addProduct() {
  try {
    await api('/api/admin/products',{method:'POST',body:JSON.stringify({
      id:document.getElementById('p_id').value.trim(),
      name:document.getElementById('p_name').value.trim(),
      name_cn:document.getElementById('p_name_cn').value.trim(),
      barcode:document.getElementById('p_barcode').value.trim(),
      category_id:document.getElementById('p_category').value||null,
      unit:document.getElementById('p_unit').value.trim(),
      image:document.getElementById('p_image_url').value.trim(),
      stock:0,
      price:document.getElementById('p_price').value,
      is_new_arrival:document.getElementById('p_new_arrival').checked,
    })});
    ['p_id','p_name','p_name_cn','p_barcode','p_unit','p_image_url'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('p_image_preview').style.display='none';
    document.getElementById('p_new_arrival').checked=false;
    flash('已添加'); loadProducts();
    document.getElementById('scanInput')?.focus();
  } catch(e){alert(e.message);}
}
async function editProduct(id) {
  const products=await api('/api/admin/products');
  const p=products.find(x=>x.id===id);
  document.getElementById('e_id').value=p.id;
  document.getElementById('e_id_original').value=p.id;
  document.getElementById('e_name').value=p.name;
  document.getElementById('e_name_cn').value=p.name_cn||'';
  document.getElementById('e_barcode').value=p.barcode||'';
  document.getElementById('e_category').value=p.category_id||'';
  document.getElementById('e_unit').value=p.unit;
  document.getElementById('e_price').value=p.price;
  document.getElementById('e_image_url').value=p.image||'';

let dragState = null;
function catPointerDown(e, id) {
  e.preventDefault();
  e.stopPropagation();
  const card = document.querySelector(`.cat-card[data-id="${id}"]`);
  if (!card) return;
  const rect = card.getBoundingClientRect();
  dragState = { id, pointerOffset: e.clientY - rect.top, card, moved: false };
  card.classList.add('dragging');
  card.style.zIndex = 50;
  card.style.position = 'relative';
  document.addEventListener('pointermove', catPointerMove);
  document.addEventListener('pointerup', catPointerUp);
}
function catPointerMove(e) {
  if (!dragState) return;
  const { card, pointerOffset } = dragState;

  const cardRectBefore = card.getBoundingClientRect();
  const cardCenter = cardRectBefore.top + cardRectBefore.height / 2;
  const list = document.getElementById('categoryList');
  const siblings = [...list.querySelectorAll('.cat-card')].filter(el => el !== card);

  let target = null;
  for (const sib of siblings) {
    const r = sib.getBoundingClientRect();
    const sibCenter = r.top + r.height / 2;
    if (cardCenter < sibCenter) { target = sib; break; }
  }
  if (target) {
    if (target.previousElementSibling !== card) {
      list.insertBefore(card, target);
      dragState.moved = true;
    }
  } else if (list.lastElementChild !== card) {
    list.appendChild(card);
    dragState.moved = true;
  }

  card.style.transform = '';
  const rect = card.getBoundingClientRect();
  const desiredTop = e.clientY - pointerOffset;
  const dy = desiredTop - rect.top;
  card.style.transform = `translateY(${dy}px)`;
}
async function catPointerUp() {
  document.removeEventListener('pointermove', catPointerMove);
  document.removeEventListener('pointerup', catPointerUp);
  if (!dragState) return;
  const { card, moved } = dragState;
  card.style.transform = '';
  card.style.zIndex = '';
  card.classList.remove('dragging');

  if (moved) {
    const list = document.getElementById('categoryList');
    const orderedIds = [...list.querySelectorAll('.cat-card')].map(el => el.dataset.id);
    CATEGORIES.sort((a, b) => orderedIds.indexOf(String(a.id)) - orderedIds.indexOf(String(b.id)));
    for (let i = 0; i < CATEGORIES.length; i++) {
      CATEGORIES[i].sort_order = i;
      await api(`/api/admin/categories/${CATEGORIES[i].id}`, { method: 'PUT', body: JSON.stringify({ name: CATEGORIES[i].name, sort_order: i }) });
    }
    flash('顺序已更新');
  }
  renderCategoryList();
  dragState = null;
}

function showQrCard(token, name) {

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(()=>flash('已复制: '+text)).catch(()=>fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed';
  ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let ok=false;
  try { ok=document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  if (ok) { flash('已复制: '+text); }
  else { prompt('请手动复制链接:', text); }
}

  loadOrders();
}
async function loadOrders() {
  const orders = await api('/api/admin/orders');
  const statusLabel = {pending:'待处理',confirmed:'已确认',shipped:'已发货',cancelled:'废弃'};
  let filtered;
  if (currentOrderTab === 'pending') {
    filtered = orders.filter(o => o.status === 'pending' || o.status === 'confirmed');
  } else if (currentOrderTab === 'shipped') {
    filtered = orders.filter(o => o.status === 'shipped');
  } else {
    filtered = orders.filter(o => o.status === 'cancelled');
  }
  document.getElementById('orderList').innerHTML = filtered.map(o => `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="item-title">${o.customer_name}</div>
        <span class="badge ${o.status}">${statusLabel[o.status]||o.status}</span>
      </div>
      <div class="item-sub">${fmtTime(o.created_at)} · 合计 €${o.total}</div>
      <div class="item-sub">${o.items.map(i=>i.product_name+' x'+i.qty).join(', ')}</div>
      ${o.note ? `<div class="item-sub">备注: ${o.note}</div>` : ''}
      <div class="actions">
        ${o.status !== 'cancelled' ? `
          <button class="btn btn-ghost" onclick="setStatus('${o.id}','confirmed')">确认</button>
          <button class="btn btn-primary" onclick="setStatus('${o.id}','shipped')">发货</button>
          <button class="btn btn-ghost" onclick="printOrder('${o.id}')">打印/PDF</button>
          <button class="btn btn-danger" onclick="setStatus('${o.id}','cancelled')">废弃</button>
        ` : `
          <button class="btn btn-ghost" onclick="setStatus('${o.id}','pending')">恢复</button>
          <button class="btn btn-ghost" onclick="printOrder('${o.id}')">打印/PDF</button>
        `}
      </div>
    </div>`).join('') || '<p style="color:#888;font-size:13px">暂无订单</p>';
}
function printOrder(id){window.open(`/api/admin/orders/${id}/print?key=${encodeURIComponent(ADMIN_KEY)}`,'_blank');}
async function setStatus(id,status){await api(`/api/admin/orders/${id}/status`,{method:'PUT',body:JSON.stringify({status})});loadOrders();}
function handleScan(code) {
  code = code.trim();
  if (!code) return;
  const codeLower = code.toLowerCase();
  // 先按条码匹配,找不到再按商品编号(id)匹配,都不分大小写
  const match = ALL_PRODUCTS.find(p => p.barcode && p.barcode.toLowerCase() === codeLower)
    || ALL_PRODUCTS.find(p => p.id.toLowerCase() === codeLower);
  if (match) {
    flash('找到商品: ' + match.name + (match.active===0?' (已下架)':''));
    editProduct(match.id);
  } else {
    flash('未找到该条码/编号,已自动填入新增表单');
    document.getElementById('p_barcode').value = code;
    document.getElementById('p_id').focus();
  }
}
const scanInputEl = document.getElementById('scanInput');
if (scanInputEl) {
  scanInputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleScan(scanInputEl.value);
      scanInputEl.value = '';
      scanInputEl.focus();
    }
  });
}

async function loadAll(){await loadCategoryCache();loadProducts();loadCategories();loadCustomers();loadOrders();loadVisitorLog();document.getElementById('scanInput')?.focus();}
if(ADMIN_KEY) loadAll();
</script>
